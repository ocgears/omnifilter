# The deploy's smoke test (e2e/smoke), nightly against the live hosted demo,
# so a broken database connection or an expired setting shows up without
# waiting for a deploy. See docs/CLOUD_RUN.md.
name: smoke

on:
  schedule:
    - cron: '41 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # For the SMOKE_ secrets. This job never signs in to Google Cloud: the
    # test tools it downloads are a lot of other people's code. It finds
    # the live address from GitHub's record of the last deploy instead.
    environment: smoke
    permissions:
      contents: read
      deployments: read
    steps:
      - name: Find the live address
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # The newest production deployment that went live has its address.
          url=$(python3 - <<'PY'
          import json, os, urllib.request
          def get(path):
              req = urllib.request.Request('https://api.github.com/repos/' + os.environ['REPO'] + path, headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
              return json.load(urllib.request.urlopen(req, timeout=30))
          for d in get('/deployments?environment=production&per_page=20'):
              done = [s for s in get('/deployments/%d/statuses?per_page=10' % d['id']) if s['state'] == 'success']
              if done and done[0].get('environment_url'):
                  print(done[0]['environment_url'])
                  break
          PY
          )
          if [ -z "$url" ]; then
            echo "::notice title=Not deployed::No deploy has gone live yet (docs/CLOUD_RUN.md), so nothing to check."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi
          echo "SMOKE_URL=$url" >> "$GITHUB_ENV"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        if: env.SKIP != '1'
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        if: env.SKIP != '1'
        with:
          node-version: 24
          cache: npm
      - if: env.SKIP != '1'
        run: npm ci --ignore-scripts && npx playwright install --with-deps chromium
      - name: Smoke test the live site
        if: env.SKIP != '1'
        env:
          SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
        run: |
          export SMOKE_PUBLIC_IP=$(curl -fsS --retry 3 https://checkip.amazonaws.com)
          npx playwright test -c e2e/smoke
