# Runs the tests on every push and pull request.
#
# The runners have no usable GPU, so the server tests run the OpenCL kernels on
# two independent CPU implementations: pocl, and Mesa's Rusticl on llvmpipe.
# Two different OpenCL compilers catch most kernel code that only works on one
# driver. See docs/GPU_SUPPORT.md.
name: test

on:
  push:
  pull_request:

# The token only needs to read the repository; a job that needs more asks
# for it itself.
permissions:
  contents: read

# A newer push to the same branch (or pull request) replaces a run still
# going. On master that's fine too: only the newest commit deploys.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # ONNX Runtime's installer would otherwise fetch a 500 MB CUDA provider.
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip
  # Test the addon's source, rather than a prebuilt download of it.
  OMNIFILTER_BUILD_FROM_SOURCE: 1

jobs:
  server:
    name: server (${{ matrix.opencl }}, Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - opencl: pocl
            packages: pocl-opencl-icd
            device: pocl
            node: 22
          - opencl: pocl
            packages: pocl-opencl-icd
            device: pocl
            node: 24
          - opencl: rusticl
            packages: mesa-opencl-icd
            device: rusticl
            node: 24
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      OMNIFILTER_DEVICE: ${{ matrix.device }}
      # Rusticl only lists drivers it's told to; llvmpipe is Mesa's CPU driver.
      RUSTICL_ENABLE: llvmpipe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the OpenCL loader, headers and ${{ matrix.opencl }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ocl-icd-opencl-dev clinfo ${{ matrix.packages }}
          clinfo --list
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run devices
      - name: Check every filter on the device
        run: bash .github/run-and-annotate.sh npm run check-device
      # One leg measures coverage too (c8, from V8's own counters).
      - name: Server tests
        if: ${{ !cancelled() }}
        env:
          COVERAGE: ${{ matrix.opencl == 'pocl' && matrix.node == 24 && 'c8 --reporter=text-summary --reporter=json-summary' || '' }}
        run: bash .github/run-and-annotate.sh npx $COVERAGE mocha --exit --timeout 120000 --file server/test/setup.js server/test
      - name: Coverage
        if: ${{ !cancelled() && matrix.opencl == 'pocl' && matrix.node == 24 }}
        run: node .github/coverage-summary.js server coverage/coverage-summary.json

  # The WebGPU backend (OMNIFILTER_BACKEND=webgpu): Dawn for Node on Mesa's
  # lavapipe, a Vulkan driver that runs on the CPU. Its results are compared
  # with OpenCL's on pocl, then every filter is checked and the whole server
  # suite runs on it.
  webgpu:
    name: server (WebGPU on lavapipe)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      # webgpu_test.js fails, rather than skipping, without the webgpu package.
      OMNIFILTER_REQUIRE_WEBGPU: 1
      WEBGPU_VERSION: 0.6.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pocl, and Vulkan with lavapipe
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ocl-icd-opencl-dev pocl-opencl-icd \
            libvulkan1 mesa-vulkan-drivers vulkan-tools
          vulkaninfo --summary
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install --no-save webgpu@$WEBGPU_VERSION
      - name: The WebGPU device
        env:
          OMNIFILTER_BACKEND: webgpu
        run: npm run devices
      - name: WebGPU's results against OpenCL's
        env:
          OMNIFILTER_DEVICE: pocl
        run: bash .github/run-and-annotate.sh npx mocha --exit --timeout 600000 --file server/test/setup.js server/test/webgpu_test.js
      - name: Check every filter on WebGPU
        if: ${{ !cancelled() }}
        env:
          OMNIFILTER_BACKEND: webgpu
        run: bash .github/run-and-annotate.sh npm run check-device
      - name: Server tests on the WebGPU backend
        if: ${{ !cancelled() }}
        env:
          OMNIFILTER_BACKEND: webgpu
        run: bash .github/run-and-annotate.sh npx mocha --exit --timeout 120000 --file server/test/setup.js server/test

  # Apple Silicon. The runner VM may have no OpenCL device; if it has one,
  # every filter is checked on it.
  macos:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check every filter, if there is an OpenCL device
        run: |
          node -e "const n = require('./server/lib/native'); console.log(JSON.stringify(n.devices(), null, 1))"
          if node -e "process.exit(require('./server/lib/native').devices().length ? 0 : 1)"; then
            bash .github/run-and-annotate.sh npm run check-device
          else
            echo "::notice title=macOS::This runner has no OpenCL device; the addon built and loaded."
          fi

  # Builds with the OpenCL headers and loader from vcpkg. The runner has no
  # OpenCL device, so this checks that the addon builds, installs and loads.
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install the OpenCL headers and loader
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install opencl:x64-windows
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $sdk = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows"
          "OPENCL_SDK=$sdk" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "$sdk\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - run: npm ci
      - name: The addon loads
        run: node -e "const n = require('./server/lib/native'); console.log(n.devices().length + ' OpenCL devices')"
      - name: The server starts without an OpenCL device
        shell: bash
        run: |
          node -e "const g = require('./server/lib/gpu_filters'); console.log(g.list().length + ' filters'); try { g.deviceInfo(); } catch (e) { console.log('as expected: ' + e.message.split('\\n')[0]); }"

  # The Angular client: a production build (which type-checks the templates
  # too) and the unit tests (Vitest, jsdom).
  client:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
      - run: npm ci
        working-directory: client
      - run: node scripts/client.js build --production
      - name: Client tests
        run: bash .github/run-and-annotate.sh node scripts/client.js test --coverage
      - name: Coverage
        if: ${{ !cancelled() }}
        run: node .github/coverage-summary.js client client/coverage/omnifilter/coverage-summary.json
      # ESLint on the server, end-to-end tests and scripts (eslint.config.js).
      # The root packages are only needed for eslint here, so the native
      # addon isn't built.
      - run: npm ci --ignore-scripts
      - run: npm run lint

  # The whole app in real browsers (Playwright): Chromium at desktop size and
  # as an Android phone, and WebKit (Safari's engine) as an iPhone. Sign up,
  # filter a photo on pocl, presets, the live preview and camera, reloads,
  # deleting, signing out; on the phones, touch gestures, every common phone
  # width upright and sideways, axe's accessibility checks and a slowed-down
  # phone; and the browser's WebGPU filters (on SwiftShader, Chromium's
  # software GPU) against the server's OpenCL ones (on pocl), pixel by pixel.
  # See e2e/.
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      OMNIFILTER_DEVICE: pocl
      # Fail, rather than skip the WebGPU comparisons, if the browser has no WebGPU.
      E2E_REQUIRE_WEBGPU: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the OpenCL loader, headers and pocl
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ocl-icd-opencl-dev pocl-opencl-icd
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: client
      - run: npx playwright install --with-deps chromium webkit
      - name: End-to-end tests
        run: bash .github/run-and-annotate.sh npx playwright test --project desktop --project phone --project iphone
      - name: Keep the report and traces of failed tests
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # The same tests in desktop Firefox, and in WebKit at desktop size (Safari's
  # engine). Without a GPU neither has WebGPU, so their filters run with
  # WebGL2, which e2e/gpu.spec.js checks against the server's, pixel by pixel.
  e2e-browsers:
    name: e2e (${{ matrix.project }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: firefox
            browser: firefox
          - project: safari
            browser: webkit
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      OMNIFILTER_DEVICE: pocl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the OpenCL loader, headers and pocl
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ocl-icd-opencl-dev pocl-opencl-icd
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: client
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: End-to-end tests
        run: bash .github/run-and-annotate.sh npx playwright test --project ${{ matrix.project }}
      - name: Keep the report and traces of failed tests
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Lighthouse's mobile audit of the production build (a mid-range phone on
  # slow 4G): performance, accessibility and best practices, against the
  # budgets in lighthouserc.js. The scores go on the run's summary page.
  lighthouse:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OMNIFILTER_DEVICE: pocl
      APP_SECRET: lighthouse-only-secret-not-for-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the OpenCL loader, headers and pocl
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ocl-icd-opencl-dev pocl-opencl-icd
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            .github/lighthouse/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: client
      - run: node scripts/client.js build --production
        env:
          OMNIFILTER_API: /
      # Lighthouse CI from its own lockfile (.github/lighthouse); it finds the
      # runner's Chrome, so nothing needs downloading.
      - run: npm ci --ignore-scripts --no-audit --no-fund --prefix .github/lighthouse
      - name: Lighthouse
        run: bash .github/run-and-annotate.sh .github/lighthouse/node_modules/.bin/lhci autorun
      - name: Scores
        if: ${{ !cancelled() }}
        run: node .github/lighthouse-summary.js
      - name: Keep the reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-report
          path: lighthouse-report/
          retention-days: 7

  # The test environment as one image (docker/ci.Dockerfile), for running
  # every suite locally with docker/test.sh, or on a machine with a GPU.
  # Built and checked here, not published.
  ci-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image
        run: bash .github/run-and-annotate.sh docker build --progress=plain -f docker/ci.Dockerfile -t omnifilter-ci .
      - name: The server tests, and the browsers, in the image
        run: |
          docker run --rm --ipc=host -v "$PWD":/work -w /work omnifilter-ci bash -c '
            set -e
            node --version
            clinfo --list
            vulkaninfo --summary | grep -E "deviceName|driverName"
            npm ci
            npx mocha --exit --timeout 120000 --file server/test/setup.js server/test
            node -e "
              const pw = require(\"@playwright/test\");
              (async () => {
                for (const type of [\"chromium\", \"webkit\", \"firefox\"]) {
                  const browser = await pw[type].launch();
                  console.log(type, browser.version());
                  await browser.close();
                }
              })().catch((e) => { console.error(e); process.exit(1); });"'

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Without the neural style models: their host (GitHub's LFS storage)
      # often answers runners with HTTP 504.
      - name: Build the image
        run: bash .github/run-and-annotate.sh docker build --progress=plain --build-arg FETCH_MODELS=false -t omnifilter .
      - name: The image finds an OpenCL device
        run: docker run --rm omnifilter npm run devices
      - name: The image has the production client, without source maps
        run: docker run --rm omnifilter sh -c 'test -s dist/index.html && ls dist/main-*.js && ! ls dist/*.map 2>/dev/null'

  # The WebGPU image (docker/vulkan.Dockerfile) on lavapipe: it finds the
  # adapter, starts beside a MongoDB, and filters a photo. The webgpu job
  # above checks every filter on the same driver; this checks the image.
  vulkan-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        # The job's steps start once MongoDB answers.
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping: 1}).ok'"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image
        run: bash .github/run-and-annotate.sh docker build --progress=plain --build-arg FETCH_MODELS=false -f docker/vulkan.Dockerfile -t omnifilter-vulkan .
      - name: The image finds a WebGPU adapter
        run: |
          docker images omnifilter-vulkan --format '::notice title=Vulkan image::{{.Size}}'
          docker run --rm omnifilter-vulkan npm run devices
      # MongoDB has sometimes gone away while the image builds (the server
      # then can't connect at all); if so, say how it ended.
      - name: MongoDB answers
        env:
          MONGO: ${{ job.services.mongo.id }}
        run: |
          for i in $(seq 1 15); do
            docker exec "$MONGO" mongosh --quiet --eval 'db.runCommand({ping: 1}).ok' > /dev/null 2>&1 && exit 0
            sleep 2
          done
          state=$(docker inspect -f 'status {{.State.Status}}, exit code {{.State.ExitCode}}, OOM-killed {{.State.OOMKilled}}' "$MONGO")
          echo "::error title=MongoDB is down::$state. $(docker logs --tail 8 "$MONGO" 2>&1 | tr '\n' ' ' | cut -c1-1500)"
          exit 1
      - name: It filters a photo
        run: |
          docker run -d --name app --network host \
            -e MONGOLAB_URI=mongodb://localhost/omnifilter_vulkan -e APP_SECRET=ci-only-secret-not-for-production-use \
            omnifilter-vulkan
          for i in $(seq 1 31); do
            if [ "$i" = 31 ]; then
              echo "::error title=Not healthy::$(curl -sS localhost:3000/health 2>&1) $(docker logs app 2>&1 | tail -5 | tr '\n' ' ')"
              exit 1
            fi
            curl -fsS localhost:3000/health && break; sleep 2
          done
          curl -fsS localhost:3000/device | tee /dev/stderr | grep -q '"platform":"WebGPU (Dawn)"'
          curl -fsS -o out.json -w 'bilateral: %{time_total} s\n' -X POST localhost:3000/transform \
            -H 'Content-Type: image/jpeg' -H 'Omnifilter-Recipe: {"tOption":"bilateral"}' \
            --data-binary @client/public/images/samples/earth-apollo-17.jpg
          grep -q '"content":"data:image/jpeg;base64,' out.json
      - name: The server's log
        if: ${{ !cancelled() }}
        run: docker logs app

  # The hosted demo's image (docker/cloud-run.Dockerfile), run as Cloud Run
  # runs it, beside a MongoDB, with the deploy's smoke test against it.
  cloud-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        # The job's steps start once MongoDB answers.
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping: 1}).ok'"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image
        run: bash .github/run-and-annotate.sh docker build --progress=plain -f docker/cloud-run.Dockerfile -t omnifilter-cloud .
      # MongoDB has sometimes gone away while the image builds (the server
      # then can't connect at all); if so, say how it ended.
      - name: MongoDB answers
        env:
          MONGO: ${{ job.services.mongo.id }}
        run: |
          for i in $(seq 1 15); do
            docker exec "$MONGO" mongosh --quiet --eval 'db.runCommand({ping: 1}).ok' > /dev/null 2>&1 && exit 0
            sleep 2
          done
          state=$(docker inspect -f 'status {{.State.Status}}, exit code {{.State.ExitCode}}, OOM-killed {{.State.OOMKilled}}' "$MONGO")
          echo "::error title=MongoDB is down::$state. $(docker logs --tail 8 "$MONGO" 2>&1 | tr '\n' ' ' | cut -c1-1500)"
          exit 1
      - name: Start it
        run: |
          docker images omnifilter-cloud --format '::notice title=Cloud Run image::{{.Size}}'
          docker run -d --name app --network host -e PORT=8080 \
            -e MONGOLAB_URI=mongodb://localhost/omnifilter_smoke -e APP_SECRET=smoke-only-secret-not-for-production-use \
            omnifilter-cloud
          for i in $(seq 1 30); do curl -fsS localhost:8080/health && exit 0; sleep 2; done
          docker logs app; exit 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts && npx playwright install --with-deps chromium
      - name: Smoke test it
        env:
          SMOKE_URL: http://localhost:8080
          SMOKE_EMAIL: smoke@example.com
          SMOKE_PASSWORD: correct horse battery
        run: npx playwright test -c e2e/smoke
      - name: The server's log
        if: ${{ !cancelled() }}
        run: docker logs app
