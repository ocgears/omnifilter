<header class="site-header">
  <a class="brand" [routerLink]="auth.token() ? '/home' : '/signin'">
    <img src="/images/logo_omnifilter_70.png" alt="" width="35" height="35" />
    <span>OmniFilter</span>
  </a>
  @if (auth.email(); as email) {
    <div class="account">
      <span class="email" [title]="email">{{ email }}</span>
      <button type="button" (click)="signOut()">Sign out</button>
    </div>
  } @else if (auth.unverified()) {
    <div class="account">
      <span class="offline">Can't reach the server</span>
      <button type="button" (click)="signOut()">Sign out</button>
    </div>
  }
</header>

<main>
  <router-outlet />
</main>

<footer class="site-footer">
  <p>
    MIT license · 2016–{{ year }} OC Gears ·
    <a href="https://github.com/AaronFilson/omnifilter">Source and readme on GitHub</a>
  </p>
</footer>
